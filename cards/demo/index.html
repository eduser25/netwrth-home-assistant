<!doctype html>
<!--
  Demo harness: loads the built card bundle with a fake `hass` serving seeded
  demo data. Used for manual testing of card configs and for the README
  screenshots (see CLAUDE.md). Serve over http from the repo root:

      python3 -m http.server 8123   # then open http://localhost:8123/cards/demo/

  Query params:
    ?censored=1   start censored (PIN 1234 reveals)
-->
<html>
<head>
  <meta charset="utf-8" />
  <title>netwrth cards demo</title>
  <style>
    body { background: #0b0f17; margin: 0; padding: 24px; font-family: sans-serif; }
    .row { display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; }
    .slot { display: block; }
    .label { color: #566; font: 11px monospace; margin: 0 0 6px 2px; }
  </style>
</head>
<body>
  <div class="row" id="cards"></div>
  <script type="module">
    import { makeDemoHass } from "../../custom_components/netwrth/frontend/netwrth-cards.js";

    // Seeded data + fake hass live in the bundle (lib/demo.ts) — the same
    // dataset the `demo: true` card option serves inside Home Assistant.
    const hass = makeDemoHass(new URLSearchParams(location.search).get("censored") === "1");

    // ---- cards ------------------------------------------------------------
    // Default gallery; override with window.CARDS before load or use setCards().
    const DEFAULT_CARDS = [
      ["netwrth-worth-card", { type: "", title: "Total", view: "all", mode: "total", range: "6m" }, 640],
      ["netwrth-flow-card", { type: "", range: "3m" }, 640],
      ["netwrth-accounts-card", { type: "", view: "all" }, 560],
      ["netwrth-stat-card", { type: "", title: "Total", view: "all", range: "1m" }, 340],
      ["netwrth-spending-card", { type: "" }, 640],
      ["netwrth-bills-card", { type: "" }, 640],
      ["netwrth-cardcycle-card", { type: "" }, 640],
      ["netwrth-cashflow-card", { type: "" }, 640],
    ];

    window.setCards = (defs) => {
      const row = document.getElementById("cards");
      row.innerHTML = "";
      for (const [tag, config, width] of defs) {
        const slot = document.createElement("div");
        slot.className = "slot";
        slot.style.width = width + "px";
        const label = document.createElement("p");
        label.className = "label";
        label.textContent = JSON.stringify(config);
        const el = document.createElement(tag);
        el.setConfig(config);
        el.hass = hass;
        slot.appendChild(label);
        slot.appendChild(el);
        row.appendChild(slot);
      }
    };
    window.setCards(window.CARDS ?? DEFAULT_CARDS);
  </script>
</body>
</html>
