# netwrth — the app's own dark identity, as a Home Assistant theme.
# Matches custom_components/netwrth cards in their default ("netwrth") theme,
# so native HA cards (tiles, weather, thermostat) sit on the same palette.
netwrth:
  # Ground and surfaces
  primary-background-color: "#0b0f17"
  secondary-background-color: "#121a27"
  lovelace-background: "radial-gradient(60% 45% at 18% 0%, rgba(96,165,250,0.14), transparent 70%), radial-gradient(50% 40% at 85% 12%, rgba(52,211,153,0.10), transparent 70%), radial-gradient(45% 50% at 60% 100%, rgba(167,139,250,0.10), transparent 70%), #0b0f17"
  app-header-background-color: "rgba(11,15,23,0.85)"
  app-header-text-color: "#e6edf7"
  app-theme-color: "#0b0f17"
  ha-card-background: "#121a27"
  card-background-color: "#121a27"
  ha-card-border-radius: 12px
  ha-card-border-width: 1px
  ha-card-border-color: "#223047"
  ha-card-box-shadow: none
  divider-color: "#223047"
  # Text
  primary-text-color: "#e6edf7"
  secondary-text-color: "#8b9bb4"
  text-primary-color: "#e6edf7"
  disabled-text-color: "#5c6b84"
  # Accent + states
  primary-color: "#60a5fa"
  accent-color: "#34d399"
  light-primary-color: "#93c5fd"
  dark-primary-color: "#2563eb"
  state-icon-color: "#8b9bb4"
  state-icon-active-color: "#fbbf24"
  state-active-color: "#60a5fa"
  state-inactive-color: "#5c6b84"
  success-color: "#34d399"
  error-color: "#f87171"
  warning-color: "#fbbf24"
  info-color: "#60a5fa"
  # Sidebar
  sidebar-background-color: "#0b0f17"
  sidebar-icon-color: "#8b9bb4"
  sidebar-text-color: "#8b9bb4"
  sidebar-selected-icon-color: "#60a5fa"
  sidebar-selected-text-color: "#e6edf7"
  sidebar-selected-background-color: "#121a27"
  # Sliders/switches
  paper-slider-active-color: "#60a5fa"
  paper-slider-knob-color: "#60a5fa"
  switch-checked-color: "#60a5fa"
  switch-checked-track-color: "#2b3b57"
  switch-unchecked-track-color: "#223047"
  # Semantic colors HA tiles use
  blue-color: "#60a5fa"
  green-color: "#34d399"
  red-color: "#f87171"
  amber-color: "#fbbf24"
  orange-color: "#fb923c"
  yellow-color: "#fbbf24"
  purple-color: "#a78bfa"
  pink-color: "#f472b6"
  cyan-color: "#22d3ee"
  teal-color: "#2dd4bf"
  indigo-color: "#818cf8"
  light-blue-color: "#93c5fd"
  # Dialogs
  ha-dialog-surface-background: "#121a27"
  mdc-theme-surface: "#121a27"
  paper-dialog-background-color: "#121a27"
  markdown-code-background-color: "#17202f"
  code-editor-background-color: "#0b0f17"
  lumo-body-text-color: "#e6edf7"

